name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت کد پروژه
        uses: actions/checkout@v6

      - name: تنظیم Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: نصب Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: دریافت آیکون برنامه
        run: |
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          curl -L "https://practical-pure-quran-path.base44.app/icon.svg" \
            -o /tmp/app_icon.svg

          sudo apt-get update
          sudo apt-get install -y imagemagick librsvg2-bin

          rsvg-convert -w 48 -h 48 /tmp/app_icon.svg \
            -o app/src/main/res/mipmap-mdpi/ic_launcher.png

          rsvg-convert -w 72 -h 72 /tmp/app_icon.svg \
            -o app/src/main/res/mipmap-hdpi/ic_launcher.png

          rsvg-convert -w 96 -h 96 /tmp/app_icon.svg \
            -o app/src/main/res/mipmap-xhdpi/ic_launcher.png

          rsvg-convert -w 144 -h 144 /tmp/app_icon.svg \
            -o app/src/main/res/mipmap-xxhdpi/ic_launcher.png

          rsvg-convert -w 192 -h 192 /tmp/app_icon.svg \
            -o app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: تنظیم آیکون لانچر
        run: |
          if [ -f app/src/main/AndroidManifest.xml ]; then
            sed -i 's#android:icon="@[^"]*"#android:icon="@mipmap/ic_launcher"#g' app/src/main/AndroidManifest.xml
            sed -i 's#android:roundIcon="@[^"]*"#android:roundIcon="@mipmap/ic_launcher"#g' app/src/main/AndroidManifest.xml
          fi

      - name: ساخت APK
        run: gradle assembleDebug --stacktrace

      - name: بررسی APK
        run: |
          echo "APK files:"
          find . -type f -name "*.apk" -print

      - name: آپلود APK
        uses: actions/upload-artifact@v4
        with:
          name: Quran-Karim-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
