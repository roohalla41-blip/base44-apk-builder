name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت کد پروژه
        uses: actions/checkout@v6

      - name: تنظیم Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: نصب Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: دریافت و تبدیل آیکون برنامه
        run: |
          mkdir -p app/src/main/res/drawable

          curl -L "https://practical-pure-quran-path.base44.app/icon.svg" \
            -o /tmp/app_icon.svg

          sudo apt-get update
          sudo apt-get install -y imagemagick

          magick /tmp/app_icon.svg \
            -background none \
            -resize 512x512 \
            app/src/main/res/drawable/app_icon.png

      - name: تنظیم آیکون APK
        run: |
          if [ -f app/src/main/AndroidManifest.xml ]; then
            sed -i 's#android:icon="@[^"]*"#android:icon="@drawable/app_icon"#g' app/src/main/AndroidManifest.xml
            sed -i 's#android:roundIcon="@[^"]*"#android:roundIcon="@drawable/app_icon"#g' app/src/main/AndroidManifest.xml
          fi

      - name: ساخت APK
        run: gradle assembleDebug --stacktrace

      - name: نمایش فایل‌های APK
        run: |
          echo "APK files:"
          find . -type f -name "*.apk" -print

      - name: آپلود APK
        uses: actions/upload-artifact@v4
        with:
          name: Base44-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
