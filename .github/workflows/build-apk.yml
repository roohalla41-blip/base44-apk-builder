name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت کد پروژه
        uses: actions/checkout@v6

      - name: تنظیم Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: نصب Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: بررسی و تنظیم آیکون برنامه
        run: |
          if [ ! -f icon.png ]; then
            echo "خطا: فایل icon.png در ریشه پروژه پیدا نشد."
            exit 1
          fi

          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          sudo apt-get update
          sudo apt-get install -y imagemagick

          convert icon.png -resize 48x48 \
            app/src/main/res/mipmap-mdpi/ic_launcher.png

          convert icon.png -resize 72x72 \
            app/src/main/res/mipmap-hdpi/ic_launcher.png

          convert icon.png -resize 96x96 \
            app/src/main/res/mipmap-xhdpi/ic_launcher.png

          convert icon.png -resize 144x144 \
            app/src/main/res/mipmap-xxhdpi/ic_launcher.png

          convert icon.png -resize 192x192 \
            app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: تنظیم آیکون لانچر
        run: |
          if [ -f app/src/main/AndroidManifest.xml ]; then
            sed -i 's#android:icon="@[^"]*"#android:icon="@mipmap/ic_launcher"#g' app/src/main/AndroidManifest.xml
            sed -i 's#android:roundIcon="@[^"]*"#android:roundIcon="@mipmap/ic_launcher"#g' app/src/main/AndroidManifest.xml
          else
            echo "هشدار: AndroidManifest.xml پیدا نشد."
          fi

      - name: ساخت APK
        run: gradle assembleDebug --stacktrace

      - name: بررسی فایل APK
        run: |
          echo "APK files:"
          find . -type f -name "*.apk" -print

      - name: آپلود APK
        uses: actions/upload-artifact@v4
        with:
          name: Quran-Karim-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
